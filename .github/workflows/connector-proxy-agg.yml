name: Build and Deploy Connector Proxy - Aggregate
on:
  push:
    paths:
      - connector-proxies/aggregate/**
      - .github/workflows/connector-proxy-agg.yml
    branches:
      - main

# Security: restrict GITHUB_TOKEN to least privilege.
# See: https://www.upwind.io/feed/hackerbot-claw-github-actions-pull-request-rce
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Connector Proxy - Aggregate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master
      - run: flyctl deploy connector-proxies/aggregate --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_CP_AGG_API_TOKEN }}
