  success_criteria_level_aa:
    notes: >-
      Automated scanning (axe-core, via axe-playwright-python, WCAG 2.1 A/AA
      rule set, impact level serious/critical) is wired into the Playwright
      browser test suite
      (spiffworkflow-frontend/test/browser/test_accessibility.py) and into CI
      (the playwright-run GitHub Actions job), gating merges on new
      serious/critical findings on the page states it covers. As of this report,
      that suite scans 21 page states -- effectively the whole application
      rather than a limited set: the login page (unauthenticated); the process
      groups list, both collapsed and with a tree node expanded to reveal model
      rows; a process model detail page; the BPMN diagram editor; the process
      instance list; the public (unauthenticated) guest task form; the
      authenticated home/task-list page; the task-completion form itself (the
      primary participant-facing surface, and previously the single biggest
      coverage gap in this suite); started-by-me; messages; data stores;
      configuration; add-secret; about; add and edit process group; add and edit
      process model; the generic process-model file editor (its CodeMirror
      instance); and the Superset Reports extension page. Additional defects
      reported outside that automated suite (via manual browser extension
      testing) were investigated and fixed individually during this effort: see
      the per-criterion remarks below.
