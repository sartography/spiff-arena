title: SpiffWorks Arena Accessibility Conformance Report
product:
  name: SpiffWorks Arena
  version: v3.1.0
  description: >-
    SpiffWorks Arena (also known as SpiffArena) is an open-source, web-based
    business process orchestration platform: a BPMN/DMN process modeler and a
    runtime for executing those process models, with a React-based web frontend
    (spiffworkflow-frontend) and a Python REST API backend
    (spiffworkflow-backend). 
author:
  name: Dan Funk
  company_name: Sartography (d/b/a SpiffWorks)
  email: dan@spiff.works
  website: https://spiff.works
  address: 510 Victoria Dr. Staunton, Va 24401
  phone: 540-457-0024
report_date: '2026-08-13'
last_modified_date: 9/2/2026
version: 4
catalog: 2.4-edition-wcag-2.1-508-en
notes: >-
  This report reflects the accessibility remediation effort completed on the
  spiffworkflow-frontend web application ahead of the v3.1.0 release. It
  documents the specific, verified findings and fixes made during this effort
  and is explicit about what has and has not been evaluated. Criteria marked
  "Not Evaluated" should be read literally: absence of a known issue is not
  evidence of conformance for those criteria. See the Notes field on the WCAG
  2.1 chapters below for the specific page states and methods covered by testing
  to date.
evaluation_methods_used: >-
  Automated testing with axe-core 4.12.1 (via the axe-playwright-python
  package), scoped to the WCAG 2.1 A/AA rule tags, run against a locally-running
  instance of the application via Playwright (Python), both interactively during
  development and as an automated regression suite wired into CI. This report
  also includes manual screen reader testing (Orca) and zoom/reflow testing.
  Keyboard operability was checked via targeted, per-page spot verification and
  tab-order review rather than an exhaustive dedicated keyboard-only walkthrough
  of the entire application; see the 2.1.1 entry for what that covered and did
  not cover. No formal criterion-by-criterion manual review beyond what is
  described in the per-criterion remarks below has been performed.
legal_disclaimer: >-
  The information herein is provided in good faith based on the specific
  automated and manual testing described in this report. This report was
  completed by the open source developers of the application as part of an
  effort to come into compliance with WCAG 2.1 AA and Section 508. It is not a
  comprehensive conformance audit and does not represent a legally-binding claim
  of WCAG 2.1 AA or Section 508 conformance. Contact the author to report any
  errors in this report or in the underlying accessibility findings.
repository: https://github.com/sartography/spiff-arena
feedback: https://github.com/sartography/spiff-arena/issues
license: AGPL-1.0
chapters:
  success_criteria_level_a:
    notes: >-
      Automated scanning (axe-core, via axe-playwright-python, WCAG 2.1 A/AA
      rule set, impact level serious/critical) is wired into the Playwright
      browser test suite
      (spiffworkflow-frontend/test/browser/test_accessibility.py) and into CI
      (the playwright-run GitHub Actions job), gating merges on new
      serious/critical findings on the page states it covers. As of this report,
      that suite scans 21 page states -- effectively the whole application. 
      Additional defects reported outside that automated suite (via manual
      browser extension testing) were investigated and fixed individually during
      this effort: see the per-criterion remarks below. 
    criteria:
      - num: 1.1.1
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Automated image-alt-text sweep found zero findings across all 21
                pages. The application uses SVG icons exclusively and has no 
                elements or role=img anywhere in the frontend.   All SVG images
                are accompanied by text, or in rare circumstances where only an
                icon is presented, there is an alt-text option.  
          - name: electronic-docs
            adherence:
              level: not-applicable
              notes: >-
                Not applicable. SpiffArena does not ship a standalone electronic
                document (e.g. PDF, Word, PowerPoint) as a product deliverable
                -- all content is delivered through the web application itself.
          - name: software
            adherence:
              level: not-applicable
              notes: >-
                Not applicable. SpiffArena has no native or installed software
                component; the entire product is delivered through the browser
                as a web application.
          - name: authoring-tool
            adherence:
              level: partially-supports
              notes: >-
                Not itself separately reviewed for this criterion;
                cross-references the 2.1.1 Authoring Tool finding in this same
                chapter rather than a separate manual review of the diagram
                canvas's roughly 16 non-hidden SVGs, since 2.1.1 already
                documents that surface as unreachable via keyboard regardless of
                whether its icons carry text alternatives.
