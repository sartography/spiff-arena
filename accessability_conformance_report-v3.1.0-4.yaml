            adherence:
              level: partially-supports
              notes: >-
                The visual diagram canvas (bpmn.io / bpmn-js, third-party) is
                not operable via keyboard alone and has no non-visual equivalent
                for its core drawing/authoring task -- a recognized category
                under ATAG 2.0, which distinguishes an authoring tool's chrome
                (expected to be accessible) from an inherently visual core
                creation task (which may not be). A weaker
                equivalent-facilitation path exists via the "View XML" action,
                which opens the process definition as plain, keyboard-operable
                text in a code editor, but this requires raw BPMN XML literacy
                with no guided UI or validation. This affects the
                process-designer audience (authoring BPMN/DMN diagrams); the
                process-participant surfaces (task completion, form-filling)
                that this effort's remediation has focused on are a separate,
                unaffected part of the application.
