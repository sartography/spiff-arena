[project]
name = "connector-archive"
version = "0.1.0"
description = "Archive a process run (summary PDF, uploaded files, manifest) from SpiffWorkflow Service Tasks"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
  "spiffworkflow-connector-command",
  "boto3>=1.26",
  "fpdf2>=2.8,<3",
]

[tool.uv.sources]
spiffworkflow-connector-command = { git = "https://github.com/sartography/spiffworkflow-connector-command.git", rev = "7e20603849ee609267ddc97c8433077e09ccd124" }

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "moto[s3]>=5", "pypdf>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "S", "UP", "W"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]
